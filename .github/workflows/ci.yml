name: CI
on:
  pull_request:
  push:
    branches: [main, prod]

# a newer push to the same branch/PR cancels the run it supersedes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17, cache: maven }
      - run: ./mvnw -B verify   # unit, integration and architecture tests, then the JaCoCo report
      - name: Coverage summary
        if: always()
        run: |
          f=target/site/jacoco/jacoco.csv
          [ -f "$f" ] && awk -F, 'NR>1 {m+=$8; c+=$9; bm+=$6; bc+=$7} END {
            printf "### Backend coverage\n\n| Metric | Covered |\n|---|---|\n| Lines | %.1f%% |\n| Branches | %.1f%% |\n", 100*c/(m+c), 100*bc/(bm+bc) }' "$f" >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: backend-coverage, path: backend/target/site/jacoco, if-no-files-found: ignore }

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npx tsc -b
      - run: npm test
      - run: npm run build
