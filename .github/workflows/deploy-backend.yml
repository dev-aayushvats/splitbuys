name: Deploy backend

# Runs when a code change under backend/ reaches main (docs and the load-test rig do not count), or by hand.
# The job sits in the "production" environment: with required reviewers set there, nothing deploys until someone approves.
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'deploy/deploy.sh'
      - '.github/workflows/deploy-backend.yml'
      - '!backend/**/*.md'
      - '!backend/loadtest/**'
  workflow_dispatch:

# one deploy at a time, and never cancel one that is mid-swap
concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # full history, so "is this still the newest commit?" is answered exactly
      # Two merges close together queue two runs; by the time the first is approved, main may have moved on. Deploying the
      # older commit would ship old code (deploy.sh refuses), so that run steps aside and the newer run deploys everything.
      - name: Is this still the newest commit on main?
        id: fresh
        run: |
          git fetch -q origin main
          head="$(git rev-parse HEAD)"; main="$(git rev-parse origin/main)"
          if [ "$head" = "$main" ] || ! git merge-base --is-ancestor "$head" "$main"; then
            echo "current=true" >> "$GITHUB_OUTPUT"   # up to date, or not on main at all: let deploy.sh decide
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipped: ${head:0:7} is behind main (${main:0:7}). The run for the newer commit deploys it."
          fi
      - if: steps.fresh.outputs.current == 'true'
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17, cache: maven }
      - name: Set up SSH
        if: steps.fresh.outputs.current == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
      # deploy.sh itself refuses unless this checkout is exactly origin/main, so if main has moved on since the push
      # that started this run, it stops instead of shipping old code. It also builds, tests, checksums, health-checks
      # and rolls back by itself.
      - name: Deploy
        if: steps.fresh.outputs.current == 'true'
        env:
          SSH_TARGET: ${{ secrets.DEPLOY_SSH_TARGET }}
          API_URL: https://api.splitbuys.aayushvats.com
        run: |
          export SSH_KEY="$HOME/.ssh/deploy_key"
          deploy/deploy.sh
