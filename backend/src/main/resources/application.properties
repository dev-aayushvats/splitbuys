spring.application.name=backend

# Local overrides: copy .env.example to .env (git-ignored). Real environment variables work the same way.
# APP_ENV_FILE exists so tests can opt out of the developer's real .env
spring.config.import=optional:file:${APP_ENV_FILE:.env}[.properties]

# Database. Defaults to a local SQLite file. To swap (e.g. Postgres): add the driver dependency and set
# DATABASE_URL, DATABASE_DRIVER, DATABASE_DIALECT (and DATABASE_USERNAME / DATABASE_PASSWORD). Nothing else changes.
spring.datasource.url=${DATABASE_URL:jdbc:sqlite:./data/splitbuys.db?foreign_keys=on}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.sqlite.JDBC}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.database-platform=${DATABASE_DIALECT:org.hibernate.community.dialect.SQLiteDialect}
# SQLite allows one writer at a time, so a single connection avoids "database is locked" errors
spring.datasource.hikari.maximum-pool-size=${DATABASE_POOL_SIZE:1}
# The schema is owned by Flyway (src/main/resources/db/migration); Hibernate never changes it.
# SQLite's INTEGER primary keys trip Hibernate's validator ("found integer, expecting bigint"), so validation is off by
# default; set JPA_DDL_AUTO=validate when running on PostgreSQL. The integration tests cover every entity either way.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.flyway.enabled=true
# one folder of migrations per database: db/migration/sqlite, db/migration/postgresql
spring.flyway.locations=classpath:db/migration/{vendor}
# adopts a database that predates Flyway: its tables are recorded as version 0 and V1 is a no-op over them
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.open-in-view=false

# Required, no default: the app refuses to start without it
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.ttl-days=${APP_JWT_TTL_DAYS:30}

app.otp.ttl-minutes=${APP_OTP_TTL_MINUTES:10}
app.otp.resend-seconds=${APP_OTP_RESEND_SECONDS:30}
app.otp.max-attempts=${APP_OTP_MAX_ATTEMPTS:5}

# Comma-separated origin patterns. Defaults to any for local development; the prod profile refuses "*".
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Admin (operations) endpoints under /api/v1/admin/** need this token in the X-Admin-Token header. Unset = disabled (404).
# At least 32 random characters, e.g.: openssl rand -hex 32
app.admin.token=${ADMIN_API_TOKEN:}

# Where database backups are written (PostgreSQL only) and how many to keep
app.backup.dir=${BACKUP_DIR:./data/backups}
app.backup.keep=${BACKUP_KEEP:14}

# Per client IP, on the unauthenticated /api/v1/auth/** and /api/v1/admin/** endpoints
app.rate-limit.auth-per-minute=${RATE_LIMIT_AUTH_PER_MINUTE:20}

# Honour X-Forwarded-* from a reverse proxy so rate limiting sees the real client address
server.forward-headers-strategy=framework

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
# an SMTP outage must not mark the whole API DOWN (and get it restarted); sending email is not critical to being alive
management.health.mail.enabled=false

# Email: with MAIL_ENABLED=false the OTP is printed to the console instead of being sent
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
