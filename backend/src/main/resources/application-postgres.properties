# PostgreSQL (tuned for Neon). Activate with SPRING_PROFILES_ACTIVE=postgres (or prod,postgres).
# DATABASE_URL must be a JDBC URL, e.g.  jdbc:postgresql://ep-xxxx.region.aws.neon.tech/neondb?sslmode=require
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Postgres supports Hibernate's schema validation, so entities are checked against the migrated schema at startup
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Neon suspends idle compute and closes its connections, and the first connection after a pause can take seconds
# to wake it. Keep the pool small, hold no idle connections, retire them before the server does, and wait patiently.
spring.datasource.hikari.maximum-pool-size=${DATABASE_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=270000
spring.datasource.hikari.connection-timeout=30000

# Migrations take session-level advisory locks, which a pooled (PgBouncer) endpoint cannot hold. If DATABASE_URL points
# at Neon's pooled host (-pooler), set DATABASE_MIGRATION_URL to the direct host; otherwise it defaults to DATABASE_URL.
spring.flyway.url=${DATABASE_MIGRATION_URL:${DATABASE_URL}}
spring.flyway.user=${DATABASE_MIGRATION_USERNAME:${DATABASE_USERNAME:}}
spring.flyway.password=${DATABASE_MIGRATION_PASSWORD:${DATABASE_PASSWORD:}}
