# Serves the PWA and reverse-proxies /api to the backend, so the browser sees ONE origin:
# no CORS, no mixed content, and the installed app and its API share an address.

# Docker's embedded DNS: the backend is looked up per request (not frozen at startup), so it may start later or restart.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    include /etc/nginx/snippets/security-headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # operations endpoints (backups, ...) are never reachable through the public site
    location /api/v1/admin/ {
        return 404;
    }

    location /api/ {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;   # a sleeping Neon database can take a few seconds to wake
        client_max_body_size 1m;
    }

    # fingerprinted build output never changes: cache it for good
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # the app shell and the service worker must always be revalidated or updates would never arrive
    location ~* ^/(index\.html|sw\.js|registerSW\.js|workbox-[^/]+\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # single-page app: unknown paths (/groups/3, /join/abc) are routes, not files
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri /index.html;
    }
}
