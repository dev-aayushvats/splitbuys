# /etc/nginx/sites-available/splitbuys  (symlink into sites-enabled), then:
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d api.example.com        # adds the listen 443 / certificate lines and the HTTP->HTTPS redirect
#
# nginx is the edge: the only thing that talks to the app, which listens on 127.0.0.1:8080.
server {
    listen 80;
    server_name api.example.com;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # OVERWRITE, never append ($proxy_add_x_forwarded_for): a client-supplied X-Forwarded-For must not reach the app,
        # or it could pick its own identity and walk around the per-IP rate limit.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
