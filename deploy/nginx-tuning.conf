# Install as /etc/nginx/conf.d/tuning.conf (included inside the http block). Written for a fresh Ubuntu nginx, where these
# directives are commented out in nginx.conf; if you uncomment them there too, nginx will refuse the duplicates.
server_tokens off;                      # do not advertise the nginx version

# the API returns JSON, which nginx does not compress by default
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
